name: Publish Forever addon guide

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/branding/forever-classmate-logo.png'
      - 'scripts/check_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate guide
        run: python3 scripts/check_site.py
      - uses: actions/configure-pages@v5
      - name: Prepare static files
        run: cp assets/branding/forever-classmate-logo.png site/logo.png
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
